services:
  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    environment:
      PORT: 3333
      STORAGE_PATH: /app/storage
    # Bind mount no repositório: o .sqlite e os .md ficam em app/api/storage,
    # permitindo o "save state" via commit no Git.
    volumes:
      - ./app/api/storage:/app/storage
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
