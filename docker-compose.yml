services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-codehub}
    # Publica o MySQL no host em 3307 (evita conflito com um MySQL local na 3306).
    # A API NÃO usa esta porta — conecta via rede interna (mysql:3306).
    # Sobrescreva com DB_HOST_PORT se necessário; ou remova para não expor.
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Aplica a migration 001 automaticamente na primeira inicialização.
      - ./app/api/src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    environment:
      PORT: 3333
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-codehub}
      STORAGE_PATH: /app/storage
    volumes:
      - snippet_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
  snippet_storage:
